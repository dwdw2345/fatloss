<title>减脂工作台</title>
<style>
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --text:#1F2937; --muted:#6B7280; --line:#E5E7EB;
  --accent:#0E6E7A; --accent2:#1F3A4D; --soft:#EAF3F4; --warn:#C0662A; --good:#2E7D5B;
  --danger:#C0392B; --radius:16px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;padding-bottom:84px;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(243,245,247,.93);backdrop-filter:blur(10px);padding:10px 2px 8px}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:19px;font-weight:800;color:var(--accent2);letter-spacing:.5px}
.save-dot{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.navbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--accent2);line-height:1}
.date-chip{flex:1;height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dateInput{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
main{margin-top:6px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid rgba(229,231,235,.7)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--accent2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{font-size:12px;font-weight:500;color:var(--muted)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,110,122,.10)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);width:100%}
.btn.ghost{background:#fff;color:var(--accent2);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #F3C9C4}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.big{font-size:30px;font-weight:800;color:var(--accent2);line-height:1.1}
.unit{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.muted{color:var(--muted);font-size:12px}
.small{font-size:11px;color:#9CA3AF}
.pill{background:var(--soft);color:var(--accent2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.pill.grey{background:#F3F4F6;color:var(--muted)}
.progress{height:10px;border-radius:999px;background:#EEF1F4;overflow:hidden;margin:10px 0 6px}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0E6E7A,#39A0A8);width:0}
.progress>i.over{background:linear-gradient(90deg,#C0662A,#E08A4A)}
.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macro{background:#F8FAFB;border-radius:12px;padding:8px;text-align:center}
.macro b{display:block;font-size:15px;color:var(--accent2)}
.macro span{font-size:11px;color:var(--muted)}
.meal{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.meal-title{font-weight:800;color:var(--accent2);font-size:14px}
.meal-kcal{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
.food-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #EDF0F2;gap:8px}
.food-item:last-child{border-bottom:none}
.food-name{font-size:14px;font-weight:600}
.food-meta{font-size:11px;color:var(--muted)}
.icon-btn{border:none;background:transparent;font-size:16px;padding:4px 6px;color:var(--muted)}
.add-line{width:100%;border:1px dashed #CBD5DB;background:#FAFCFC;color:var(--accent);border-radius:10px;padding:9px;font-size:13px;font-weight:700;margin-top:8px}
.empty{color:#9CA3AF;font-size:12px;padding:8px 0}
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{border:none;background:transparent;padding:6px 2px;border-radius:10px;color:#94A3B8;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.active{color:var(--accent);background:var(--soft)}
.trend-up{color:var(--warn);font-weight:700}
.trend-down{color:var(--good);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;border-bottom:1px solid #EEF1F4;text-align:center}
th{color:var(--muted);font-weight:600;font-size:11px}
.chart-wrap{margin-top:4px}
.legend{display:flex;gap:12px;justify-content:center;margin-top:2px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.lg{display:inline-flex;align-items:center}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.42)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:86vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,16px)}to{transform:translate(-50%,0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.sheet-head h3{margin:0;font-size:16px;color:var(--accent2)}
.close{border:none;background:#F3F4F6;border-radius:999px;width:32px;height:32px;font-size:15px;color:var(--muted);flex:none}
.search{position:sticky;top:0;background:#fff;padding-bottom:8px;z-index:2}
.food-list{max-height:44vh;overflow:auto;margin-top:4px}
.food-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid #F1F3F5;gap:8px}
.food-row .n{font-size:15px;font-weight:600}
.food-row .k{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--accent2);font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.big-input{font-size:26px;font-weight:800;text-align:center;padding:12px;color:var(--accent2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(31,58,77,.94);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.help{font-size:12px;color:var(--muted);line-height:1.65}
.help b{color:var(--accent2)}
.hr{height:1px;background:#EEF1F4;margin:12px 0}
.footer-note{text-align:center;color:#9CA3AF;font-size:11px;padding:10px 0 4px}
.seg{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;flex:none}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:#F8FAFB;border-radius:12px;padding:10px}

.badge.red{background:#FBEAE8;color:#C0392B}.badge.blue{background:#EAF3F4;color:#0E6E7A}
.badge.grey{background:#F3F4F6;color:#6B7280}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.ex .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex .meta{font-size:11px;color:var(--muted);margin-top:2px}
.ex .cue{font-size:12px;color:#4B5563;margin-top:6px;line-height:1.5}
.timer-big{font-size:62px;font-weight:800;text-align:center;color:var(--accent2);font-variant-numeric:tabular-nums;line-height:1.1}
.timer-phase{text-align:center;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar-row .lbl{width:40px;font-size:12px;color:var(--muted);flex:none}
.bar{flex:1;height:8px;background:#EEF1F4;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.notice{background:#FFF8ED;border:1px solid #F3D9B8;border-radius:12px;padding:10px 12px;font-size:12px;color:#7A4A1E;line-height:1.6}
.notice.blue{background:#EFF7F8;border-color:#CFE6E8;color:#0E5A63}
.notice.red{background:#FBEAE8;border-color:#F3C9C4;color:#8E2B20}
.mini{font-size:11px;color:#9CA3AF}
.tabs2{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs2 button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
</style>
</head>

function defaultState(){
  return {version:2,
    profile:{sex:'female',age:28,height:160,weight:60,activity:1.55,goal:'lose',rate:0.5,targetWeight:55,targetWaist:75,name:''},
    settings:{targetKcal:1450,targetProtein:110,targetFat:50,targetCarbs:140,waterTarget:2000,startDate:todayStr()},
    days:{},customFoods:[],favorites:[],program:{}};
}
function migrate(s){
  if(!s||typeof s!=='object'||!s.days)return null;
  if(!s.version||s.version<2){
    s.version=2;
    if(!s.profile)s.profile={sex:'female',age:28,height:160,weight:60,activity:1.55,goal:'lose',rate:0.5,targetWeight:55,targetWaist:75,name:''};
    if(!s.settings)s.settings={};
    if(!s.settings.targetKcal)s.settings.targetKcal=1450;
    if(!s.settings.targetProtein)s.settings.targetProtein=110;
    if(!s.settings.targetFat)s.settings.targetFat=Math.round(s.settings.targetKcal*0.28/9);
    if(!s.settings.targetCarbs)s.settings.targetCarbs=Math.max(50,Math.round((s.settings.targetKcal-s.settings.targetProtein*4-s.settings.targetFat*9)/4));
    if(!s.settings.waterTarget)s.settings.waterTarget=2000;
    if(!s.settings.startDate)s.settings.startDate=Object.keys(s.days).sort()[0]||todayStr();
    if(!s.favorites)s.favorites=[];
    if(!s.program)s.program={};
    if(!s.customFoods)s.customFoods=[];
    if(!s.profile.targetWeight)s.profile.targetWeight=55;
    if(!s.profile.targetWaist)s.profile.targetWaist=75;
    const ds=Object.keys(s.days).sort();
    for(let i=ds.length-1;i>=0;i--){if(typeof s.days[ds[i]].weight==='number'){s.profile.weight=s.days[ds[i]].weight;break;}}
  }
  return s;
}

/* ===================== 工具 ===================== */
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function todayStr(){return fmtDate(new Date());}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function weekdayName(s){return ['周日','周一','周二','周三','周四','周五','周六'][parseDate(s).getDay()];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n,d=0){if(n==null||isNaN(n))return '—';return Number(n).toFixed(d);}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function round1(n){return Math.round(n*10)/10;}

/* ===================== 数据访问 ===================== */
function emptyDay(){return {weight:null,waist:null,hip:null,thigh:null,arm:null,chest:null,neck:null,sleep:null,steps:null,hunger:null,stress:null,energy:null,water:0,periodStart:false,periodEnd:false,training:'',meals:{breakfast:[],lunch:[],dinner:[],snack:[]},workouts:[],note:'',photo:false};}
function getDay(d){return S.days[d]||emptyDay();}
function dayRef(d){
  if(!S.days[d])S.days[d]=emptyDay();
  const day=S.days[d];
  if(!day.meals)day.meals={breakfast:[],lunch:[],dinner:[],snack:[]};
  MEALS.forEach(m=>{if(!Array.isArray(day.meals[m.id]))day.meals[m.id]=[];});
  if(!Array.isArray(day.workouts))day.workouts=[];
  return day;
}
function hasData(day){if(!day)return false;const t=dayTotals(day);return t.k>0||day.weight!=null||day.waist!=null||(day.workouts&&day.workouts.length>0);}
function allFoods(){return FOOD_DB.concat(S.customFoods||[]);}
function foodByName(n){return allFoods().find(f=>f.n===n);}
function itemMacros(it){const f=foodByName(it.n);const g=Number(it.g)||0;if(!f)return {k:0,p:0,f:0,c:0};const r=g/100;return {k:f.k*r,p:f.p*r,f:f.f*r,c:f.c*r};}
function mealTotals(items){return (items||[]).reduce((a,it)=>{const m=itemMacros(it);a.k+=m.k;a.p+=m.p;a.f+=m.f;a.c+=m.c;return a;},{k:0,p:0,f:0,c:0});}
function dayTotals(day){const t={k:0,p:0,f:0,c:0};MEALS.forEach(m=>{const x=mealTotals(day.meals&&day.meals[m.id]);t.k+=x.k;t.p+=x.p;t.f+=x.f;t.c+=x.c;});return t;}

/* ===================== 代谢计算 ===================== */
function bmi(){const p=S.profile;return p.height?p.weight/Math.pow(p.height/100,2):null;}
function bmrMifflin(){const p=S.profile;const b=10*p.weight+6.25*p.height-5*p.age;return p.sex==='male'?b+5:b-161;}
function bodyFatNavy(date){
  const d=getDay(date||selDate),p=S.profile,w=d.waist,n=d.neck,h=d.hip;
  if(!w||!n)return null;
  if(p.sex==='female'){
    if(!h)return null;
    const v=1.29579-0.35004*Math.log10(w+h-n)+0.22100*Math.log10(p.height);
    return clamp(495/v-450,3,60);
  }
  const v=1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(p.height);
  return clamp(495/v-450,3,60);
}
function bodyFatBMI(){const b=bmi(),p=S.profile;return b?1.2*b+0.23*p.age-10.8*(p.sex==='male'?1:0)-5.4:null;}
function latestBodyFat(){
  const ds=Object.keys(S.days).sort();
  for(let i=ds.length-1;i>=0;i--){
    const d=S.days[ds[i]];
    if(d&&d.waist&&d.neck&&(S.profile.sex!=='female'||d.hip))return bodyFatNavy(ds[i]);
  }
  return null;
}
function bmrKatch(){const bf=latestBodyFat();if(bf==null)return null;const lbm=S.profile.weight*(1-bf/100);return 370+21.6*lbm;}
function tdeeFormula(){return bmrMifflin()*S.profile.activity;}
function formulaTarget(){
  const p=S.profile,tdef=tdeeFormula();
  let adj=0;
  if(p.goal==='lose')adj=-p.rate*7700/7;
  else if(p.goal==='gain')adj=p.rate*7700/7;
  let kcal=Math.max(p.sex==='male'?1500:1200,Math.round(tdef+adj));
  const protein=Math.round(p.weight*(p.goal==='lose'?1.8:1.6));
  const fat=Math.max(Math.round(p.weight*0.8),Math.round(kcal*0.25/9));
  const carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,fat,carbs,tdee:Math.round(tdef),bmr:Math.round(bmrMifflin()),adj:Math.round(adj)};
}
function bodyFatLabel(bf,sex){
  if(bf==null)return '';
  if(sex==='male'){if(bf<6)return '偏低';if(bf<14)return '运动员';if(bf<18)return '健身';if(bf<25)return '平均';return '偏高';}
  if(bf<14)return '偏低';if(bf<21)return '运动员';if(bf<25)return '健身';if(bf<32)return '平均';return '偏高';
}

/* ===================== 月经周期 ===================== */
function periodStarts(){return Object.keys(S.days).filter(d=>S.days[d]&&S.days[d].periodStart).sort();}
function cycleInfo(date){
  const p=S.profile;
  if(p.sex!=='female')return null;
  const starts=periodStarts().filter(d=>d<=date);
  if(!starts.length)return null;
  const last=starts[starts.length-1];
  const day=diffDays(last,date)+1;
  const intervals=[];
  for(let i=1;i<starts.length;i++)intervals.push(diffDays(starts[i-1],starts[i]));
  const avgLen=intervals.length?Math.round(avg(intervals)):28;
  const phase=day<=5?'月经期':day<=13?'卵泡期':day<=16?'排卵期':'黄体期';
  return {day,phase,avgLen,next:addDays(last,avgLen),last,count:starts.length};
}

/* ===================== 体重与周汇总 ===================== */
function avgWeight(endDate,n=7){const arr=[];for(let i=0;i<n;i++){const d=addDays(endDate,-i);const day=S.days[d];if(day&&typeof day.weight==='number'&&day.weight>0)arr.push(day.weight);}return arr.length>=3?avg(arr):null;}
function weightChange(endDate){const now=avgWeight(endDate,7),prev=avgWeight(addDays(endDate,-7),7);if(now==null||prev==null)return null;return now-prev;}
function weekStart(s){const d=parseDate(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return fmtDate(d);}
function weeklyStats(){
  const logged=Object.keys(S.days).filter(d=>hasData(S.days[d])).sort();
  let start=S.settings.startDate||todayStr();
  if(logged.length&&logged[0]<start)start=logged[0];
  const out=[];let ws=weekStart(start);
  if(parseDate(ws)>parseDate(selDate))return out;
  while(parseDate(ws)<=parseDate(selDate)){
    const dates=[...Array(7)].map((_,i)=>addDays(ws,i));
    const days=dates.map(d=>S.days[d]).filter(Boolean);
    const w=days.map(d=>d.weight).filter(v=>typeof v==='number');
    const k=days.map(d=>dayTotals(d).k).filter(v=>v>0);
    const pr=days.map(d=>dayTotals(d).p).filter(v=>v>0);
    const wa=days.map(d=>d.waist).filter(v=>typeof v==='number');
    const st=days.map(d=>d.steps).filter(v=>typeof v==='number'&&v>0);
    const sl=days.map(d=>d.sleep).filter(v=>typeof v==='number'&&v>0);
    const tr=days.filter(d=>d.training&&d.training!=='休息').length;
    out.push({start:ws,avgW:avg(w),avgK:avg(k),avgP:avg(pr),waist:avg(wa),steps:avg(st),sleep:avg(sl),train:tr});
    ws=addDays(ws,7);
  }
  for(let i=0;i<out.length;i++){
    const w=out[i],prev=i>0?out[i-1]:null;
    if(prev&&w.avgW!=null&&prev.avgW!=null&&w.avgK!=null){
      w.tdee=w.avgK-(w.avgW-prev.avgW)*7700/7;
      w.sug=Math.max(1250,Math.round(w.tdee-325));
    }
  }
  return out;
}
function volumeWeek(){
  const ws=weekStart(selDate),map={};
  for(let i=0;i<7;i++){
    const day=S.days[addDays(ws,i)];
    if(!day)continue;
    (day.workouts||[]).forEach(w=>{
      if(w.kind==='cardio')return;
      const m=w.muscle||'全身';
      map[m]=(map[m]||0)+(Number(w.sets)||0);
    });
  }
  return map;
}

/* ===================== 图表 ===================== */
function svgChart(dates,series){
  const W=340,H=180,pl=38,pr=8,pt=14,pb=26;
  const vals=series.flatMap(s=>s.values).filter(v=>typeof v==='number');
  if(!vals.length)return '<div class="empty">还没有数据，先去记录吧</div>';
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<0.8){const c=(max+min)/2;min=c-0.5;max=c+0.5;}
  const pad=(max-min)*0.18;min-=pad;max+=pad;
  const x=i=>dates.length<=1?pl+(W-pl-pr)/2:pl+(W-pl-pr)*i/(dates.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let grid='';
  for(let k=0;k<=3;k++){
    const yy=pt+(H-pt-pb)*k/3,val=max-(max-min)*k/3;
    grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#E9EDF0"/>`;
    grid+=`<text x="${pl-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="#9CA3AF">${val.toFixed(1)}</text>`;
  }
  const tickIdx=[0,Math.floor((dates.length-1)/2),dates.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  let xl='';
  tickIdx.forEach(i=>{
    let anchor='middle',xx=x(i);
    if(dates.length>1&&i===0){anchor='start';xx=pl;}
    if(dates.length>1&&i===dates.length-1){anchor='end';xx=W-pr;}
    xl+=`<text x="${xx}" y="${H-8}" text-anchor="${anchor}" font-size="9" fill="#9CA3AF">${dates[i].slice(5)}</text>`;
  });
  let paths='';
  series.forEach(s=>{
    let d='',started=false;
    s.values.forEach((v,i)=>{
      if(typeof v!=='number'){started=false;return;}
      d+=(started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';
      started=true;
    });
    if(d){
      paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(s.dots)s.values.forEach((v,i)=>{if(typeof v==='number')paths+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.3" fill="${s.color}"/>`;});
    }
  });
  const legend=series.map(s=>`<span class="lg"><i style="background:${s.color}"></i>${s.name}</span>`).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${xl}${paths}</svg><div class="legend">${legend}</div></div>`;
}

/* ===================== 导航 ===================== */
function setView(v){view=v;closeSheet();document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render();window.scrollTo(0,0);}
function shiftDate(n){selDate=addDays(selDate,n);render();}
function pickDate(v){if(v){selDate=v;render();}}
function openDatePicker(){const el=document.getElementById('dateInput');el.value=selDate;if(el.showPicker){try{el.showPicker();return;}catch(e){}}el.click();}
function updateDateBar(){
  const el=document.getElementById('dateLabel');
  if(!el)return;
  const d=parseDate(selDate);
  el.textContent=(selDate===todayStr()?'今天 · ':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+weekdayName(selDate);
  document.getElementById('dateInput').value=selDate;
}
function render(){
  updateDateBar();
  document.getElementById('datebar').style.display=view==='me'?'none':'flex';
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));
  const v=document.getElementById('view');
  if(view==='today')v.innerHTML=vToday();
  else if(view==='diet')v.innerHTML=vDiet();
  else if(view==='train')v.innerHTML=vTrain();
  else if(view==='body')v.innerHTML=vBody();
  else v.innerHTML=vMe();
}
function setField(k,v){const day=dayRef(selDate);if(v===''||v==null)day[k]=null;else day[k]=Number(v);if(k==='weight')syncProfileWeight();save();render();}
function syncProfileWeight(){
  const ds=Object.keys(S.days).sort();
  for(let i=ds.length-1;i>=0;i--){const w=S.days[ds[i]].weight;if(typeof w==='number'&&w>0){S.profile.weight=w;return;}}
}
function setText(k,v){const day=dayRef(selDate);day[k]=v||'';save();render();}
function addWater(ml){const day=dayRef(selDate);day.water=Math.max(0,(Number(day.water)||0)+ml);save();render();}
function togglePeriod(){const day=dayRef(selDate);day.periodStart=!day.periodStart;save();render();}
function setChartMetric(m){chartMetric=m;save();render();}
function goalEta(){
  const cur=avgWeight(selDate,7)||S.profile.weight,target=S.profile.targetWeight||55;
  const ch=weightChange(selDate);
  if(ch==null||ch>=0||cur<=target)return null;
  const weeks=(cur-target)/(-ch);
  return weeks>0&&weeks<130?Math.round(weeks):null;
}

function plateauHtml(){
  const ws=weeklyStats().filter(w=>w.avgW!=null);
  if(ws.length<3)return '<div class="small" style="margin-top:8px">连续记录 3 周后，这里会提示是否进入平台期。</div>';
  const a=ws[ws.length-3],b=ws[ws.length-1];
  const dw=b.avgW-a.avgW,dwa=(b.waist!=null&&a.waist!=null)?b.waist-a.waist:null;
  if(Math.abs(dw)<0.25&&(dwa==null||Math.abs(dwa)<0.5)){
    return '<div class="notice" style="margin-top:8px">最近 3 周体重和腰围变化很小：先检查睡眠、月经、钠、便秘和饮食记录准确性；确认无误后，再考虑每天加 2000 步，或安排 10–14 天饮食休息（吃到 TDEE），最后才减 100–150 kcal。</div>';
  }
  return '<div class="small" style="margin-top:8px">最近 3 周体重变化 '+dw.toFixed(1)+' kg，腰围'+(dwa!=null?(dwa>0?'+':'')+dwa.toFixed(1)+' cm':'—')+'。</div>';
}

/* ===================== 训练 ===================== */
function vTrain(){
  const day=getDay(selDate),ws=day.workouts||[];
  const strength=ws.filter(w=>w.kind!=='cardio'),cardio=ws.filter(w=>w.kind==='cardio');
  const vol=volumeWeek();
  const volKeys=['胸','背','肩','腿','臀','手臂','核心','全身'];
  return `
  <div class="card">
    <h3>力量训练 <span class="sub">${strength.length} 个动作</span></h3>
    ${strength.length?strength.map(w=>`<div class="food-item">
      <div><div class="food-name">${esc(w.name)}</div><div class="food-meta">${w.sets||0} 组 × ${w.reps||0} 次 · ${w.weight||0} kg · RPE ${w.rpe||'-'}${w.muscle?` · ${w.muscle}`:''}</div></div>
      <button class="icon-btn" onclick="delWorkoutById('${w.id}')">✕</button>
    </div>`).join(''):'<div class="empty">今天还没记录力量训练</div>'}
    <button class="add-line" onclick="openWorkoutSheet('strength')">＋ 添加动作</button>
    <button class="add-line" onclick="openExercisePicker()">🔍 从动作库选择</button>
  </div>
  <div class="card">
    <h3>有氧 <span class="sub">${cardio.length} 条</span></h3>
    ${cardio.length?cardio.map(w=>`<div class="food-item">
      <div><div class="food-name">${esc(w.name)}</div><div class="food-meta">${w.duration||0} 分钟${w.incline?` · 坡度 ${w.incline}`:''}${w.speed?` · 速度 ${w.speed}`:''}</div></div>
      <button class="icon-btn" onclick="delWorkoutById('${w.id}')">✕</button>
    </div>`).join(''):'<div class="empty">今天还没记录有氧</div>'}
    <button class="add-line" onclick="openWorkoutSheet('cardio')">＋ 添加有氧</button>
  </div>
  <div class="card">
    <h3>本周训练量 <span class="sub">目标 10–20 组/肌群</span></h3>
    ${volKeys.filter(k=>vol[k]).length?volKeys.filter(k=>vol[k]).map(k=>{
      const v=vol[k],pct=Math.min(100,Math.round(v/20*100));
      return `<div class="bar-row"><span class="lbl">${k}</span><div class="bar"><i style="width:${pct}%"></i></div><span class="small">${v} 组</span></div>`;
    }).join(''):'<div class="empty">本周还没有力量训练记录</div>'}
  </div>
  <div class="card">
    <button class="btn soft" onclick="openTemplates()">📋 训练模板（新手/上下肢/推拉腿/居家/功能性/HIIT）</button>
    <div style="height:8px"></div>
    <div class="row">
      <button class="btn ghost" style="flex:1" onclick="openTimer('hiit')">⏱ HIIT 计时</button>
      <button class="btn ghost" style="flex:1" onclick="openTimer('rest')">⏲ 休息计时</button>
    </div>
  </div>
  <div class="card"><div class="help"><b>训练原则：</b>复合动作优先；每组留 1–2 次余力（RIR 1–2）；做到次数上限再加重量；每 6–8 周安排 1 周减量。有氧 2 次 LISS + 1 次间歇即可，别用有氧代替力量训练。</div></div>`;
}

      <b>蔬菜</b> 300–500g（深色占一半）｜<b>水果</b> 200–350g<br>
      <b>畜禽肉</b> 40–75g｜<b>水产品</b> 40–75g｜<b>蛋类</b> 40–50g<br>
      <b>奶类</b> 300–500g｜<b>大豆及坚果</b> 25–35g<br>
      <b>油</b> 25–30g｜<b>盐</b> &lt;5g｜<b>饮水</b> 女 1500ml / 男 1700ml<br>

      <b>基础代谢</b>：Mifflin-St Jeor（1990）是成年人最常用的预测公式；Katch-McArdle 需要体脂率。<br>
      <b>TDEE</b>：BMR × 活动系数（1.2 久坐 / 1.375 轻度 / 1.55 中度 / 1.725 高度 / 1.9 极高），是估算；实际值以体重反推为准。<br>

function setSetting(k,v){S.settings[k]=Number(v)||0;save();render();}
function setProfile(k,v){
  if(['age','height','weight','activity','rate','targetWeight','targetWaist'].includes(k))S.profile[k]=Number(v)||0;
  else S.profile[k]=v;
  if(k==='goal'){if(v==='maintain')S.profile.rate=0;else if(Number(S.profile.rate)===0)S.profile.rate=0.5;}
  save();render();
}
function applyFormulaTargets(){
  const f=formulaTarget();
  S.settings.targetKcal=f.kcal;S.settings.targetProtein=f.protein;S.settings.targetFat=f.fat;S.settings.targetCarbs=f.carbs;
  save();render();toast('已按公式应用目标');
}
function delCustomFood(i){if(!confirm('删除这个自定义食物？'))return;S.customFoods.splice(i,1);save();render();}

/* ===================== 弹窗框架 ===================== */
function openSheet(html){const sh=document.getElementById('sheet');sh.innerHTML=html;document.getElementById('sheetWrap').classList.add('open');}
function closeSheet(){document.getElementById('sheetWrap').classList.remove('open');stopTimers();}
function stopTimers(){if(hiit.timer){clearInterval(hiit.timer);hiit.timer=null;}hiit.running=false;if(restTimer.timer){clearInterval(restTimer.timer);restTimer.timer=null;}restTimer.running=false;}
function renderSheet(){
  if(picker.kind==='workout'){openSheet(sheetWorkout());return;}
  if(picker.kind==='exercise'){openSheet(sheetExerciseList());renderExerciseRows();return;}
  if(picker.kind==='template'){openSheet(sheetTemplate());return;}
  if(picker.kind==='timer'){openSheet(sheetTimer());updateTimerUI();return;}
  if(picker.kind!=='food'){closeSheet();return;}
  if(picker.step==='list'){
    openSheet(`
      <div class="sheet-head"><h3>添加到 ${MEALS.find(m=>m.id===picker.meal).name}</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="search"><input id="foodSearch" placeholder="搜索食物，如 鸡蛋 / 鸡胸 / 米饭" oninput="renderFoodRows()"></div>
      <div class="seg">${FOOD_CATS.map(c=>`<button class="${(picker.cat||'全部')===c?'on':''}" onclick="picker.cat='${c}';renderSheet()">${c}</button>`).join('')}</div>
      <div class="food-list" id="foodList"></div>
      <div class="hr"></div>
      <button class="btn ghost" onclick="picker.step='custom';renderSheet()">＋ 找不到？手动添加食物</button>`);
    renderFoodRows();
  }else if(picker.step==='grams'){
    const f=picker.food;
    openSheet(`
      <div class="sheet-head"><h3>${esc(f.n)}</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="muted">每 100g：${f.k} kcal · 蛋白 ${f.p}g · 脂肪 ${f.f}g · 碳水 ${f.c}g</div>
      <input class="big-input" id="gramsInput" type="number" inputmode="decimal" value="100" oninput="updateGramsPreview()">
      <div class="chips">${[50,100,150,200,250].map(g=>`<button class="chip" onclick="setGrams(${g})">${g}g</button>`).join('')}</div>
      <div id="gramsPreview" class="help" style="text-align:center"></div>
      <div style="height:12px"></div>
      <button class="btn" onclick="addPickedFood()">添加到${MEALS.find(m=>m.id===picker.meal).name}</button>`);
    document.getElementById('gramsInput').focus();updateGramsPreview();
  }else if(picker.step==='custom'){
    openSheet(`
      <div class="sheet-head"><h3>手动添加食物</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="field"><label>食物名称</label><input id="cfName" placeholder="如：自制鸡肉丸"></div>
      <div class="row" style="margin-top:10px"><div class="field"><label>热量 kcal /100g</label><input id="cfK" type="number" inputmode="decimal" placeholder="150"></div><div class="field"><label>蛋白 g /100g</label><input id="cfP" type="number" inputmode="decimal" placeholder="20"></div></div>
      <div class="row" style="margin-top:10px"><div class="field"><label>脂肪 g /100g</label><input id="cfF" type="number" inputmode="decimal" placeholder="5"></div><div class="field"><label>碳水 g /100g</label><input id="cfC" type="number" inputmode="decimal" placeholder="10"></div></div>
      <div style="height:12px"></div>
      <button class="btn" onclick="saveCustomFood()">保存并继续</button>`);
  }else if(picker.step==='edit'){
    const it=picker.food;
    openSheet(`
      <div class="sheet-head"><h3>${esc(it.n)}</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <input class="big-input" id="gramsInput" type="number" inputmode="decimal" value="${it.g}">
      <div style="height:12px"></div>
      <button class="btn" onclick="saveEditItem()">保存</button>
      <div style="height:8px"></div>
      <button class="btn danger" onclick="delItem('${picker.meal}',${picker.idx});closeSheet()">删除</button>`);
    document.getElementById('gramsInput').focus();
  }else if(picker.step==='quickMeal'){
    openSheet(`
      <div class="sheet-head"><h3>${esc(picker.food.n)} 加到哪一餐？</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="chips">${MEALS.map(m=>`<button class="chip" onclick="picker.meal='${m.id}';picker.step='grams';renderSheet()">${m.icon} ${m.name}</button>`).join('')}</div>`);
  }
}

/* ===================== 食物选择 ===================== */
function filteredFoods(q){
  const cat=picker.cat||'全部';
  q=(q||'').trim().toLowerCase();
  return allFoods().filter(f=>(cat==='全部'||f.cat===cat)&&(!q||f.n.toLowerCase().includes(q)));
}
function renderFoodRows(){
  const el=document.getElementById('foodList');
  if(!el)return;
  const q=document.getElementById('foodSearch')?document.getElementById('foodSearch').value:'';
  picker.list=filteredFoods(q);
  el.innerHTML=picker.list.length?picker.list.map((f,i)=>`<div class="food-row" onclick="pickFood(${i})">
    <div><div class="n">${esc(f.n)}</div><div class="k">每100g ${f.k} kcal · 蛋白 ${f.p}g · ${f.cat}</div></div>
    <button class="icon-btn" onclick="event.stopPropagation();toggleFav('${esc(f.n)}')">${(S.favorites||[]).includes(f.n)?'★':'☆'}</button></div>`).join(''):'<div class="empty">没有找到，试试手动添加</div>';
}
function pickFood(i){picker.food=picker.list[i];picker.step='grams';renderSheet();}
function setGrams(g){const el=document.getElementById('gramsInput');el.value=g;updateGramsPreview();}
function updateGramsPreview(){
  const g=Number(document.getElementById('gramsInput').value)||0,f=picker.food,r=g/100;
  document.getElementById('gramsPreview').innerHTML=`≈ <b>${Math.round(f.k*r)} kcal</b> · 蛋白 ${(f.p*r).toFixed(1)}g · 脂肪 ${(f.f*r).toFixed(1)}g · 碳水 ${(f.c*r).toFixed(1)}g`;
}
function addPickedFood(){
  const g=Number(document.getElementById('gramsInput').value);
  if(!g||g<=0){toast('请输入克数');return;}
  dayRef(selDate).meals[picker.meal].push({n:picker.food.n,g});
  save();closeSheet();render();toast('已添加');
}
function openFoodPicker(mealId){picker={kind:'food',step:'list',meal:mealId,food:null,cat:'全部'};renderSheet();}
function openItemSheet(mealId,idx){const it=getDay(selDate).meals[mealId][idx];picker={kind:'food',step:'edit',meal:mealId,idx,food:it};renderSheet();}
function saveEditItem(){const g=Number(document.getElementById('gramsInput').value);if(!g||g<=0){toast('请输入克数');return;}dayRef(selDate).meals[picker.meal][picker.idx].g=g;save();closeSheet();render();toast('已保存');}
function delItem(mealId,idx){dayRef(selDate).meals[mealId].splice(idx,1);save();render();}
function saveCustomFood(){
  const n=document.getElementById('cfName').value.trim(),k=Number(document.getElementById('cfK').value);
  if(!n){toast('请输入名称');return;}if(!k){toast('请输入热量');return;}
  const f={n,k,p:Number(document.getElementById('cfP').value)||0,f:Number(document.getElementById('cfF').value)||0,c:Number(document.getElementById('cfC').value)||0,cat:'自定义',custom:true};
  S.customFoods.push(f);save();picker.food=f;picker.step='grams';renderSheet();
}
function quickAdd(name){
  const f=foodByName(name);if(!f)return;
  picker={kind:'food',step:'quickMeal',food:f,meal:null};renderSheet();
}
function toggleFav(name){
  const i=(S.favorites||[]).indexOf(name);
  if(i>=0)S.favorites.splice(i,1);else S.favorites.push(name);
  save();renderFoodRows();
}
function copyYesterday(){
  const y=addDays(selDate,-1),yd=S.days[y];
  if(!yd){toast('昨天没有记录');return;}
  const day=dayRef(selDate);let n=0;
  MEALS.forEach(m=>{if((yd.meals[m.id]||[]).length){day.meals[m.id]=(yd.meals[m.id]||[]).map(x=>({...x}));n++;}});
  if(!n){toast('昨天没有饮食记录');return;}

/* ===================== 计时器 ===================== */
function openTimer(mode){picker={kind:'timer',mode};renderSheet();}
function sheetTimer(){
  if(picker.mode==='hiit'){
    return `<div class="sheet-head"><h3>HIIT 计时器</h3><button class="close" onclick="closeSheet()">✕</button></div>
      <div class="timer-phase" id="hiitPhase">准备</div>
      <div class="timer-big" id="hiitTime">00:00</div>
      <div class="small" style="text-align:center;margin:4px 0 10px" id="hiitRound">第 0 / 8 轮</div>
      <div class="row"><div class="field"><label>训练 s</label><input id="hWork" type="number" inputmode="numeric" value="${hiit.work}"></div><div class="field"><label>休息 s</label><input id="hRest" type="number" inputmode="numeric" value="${hiit.rest}"></div></div>
      <div class="row" style="margin-top:10px"><div class="field"><label>轮数</label><input id="hRounds" type="number" inputmode="numeric" value="${hiit.rounds}"></div><div class="field"><label>准备 s</label><input id="hPrep" type="number" inputmode="numeric" value="${hiit.prep}"></div></div>
      <div class="chips" style="margin-top:10px"><button class="chip" onclick="presetHIIT(20,10,8)">Tabata 20/10×8</button><button class="chip" onclick="presetHIIT(30,30,10)">30/30×10</button><button class="chip" onclick="presetHIIT(40,20,8)">40/20×8</button></div>
      <div style="height:8px"></div>
      <button class="btn" onclick="hiitStart()">开始</button>
      <div style="height:8px"></div>
      <div class="row"><button class="btn ghost" style="flex:1" onclick="hiitPause()">暂停/继续</button><button class="btn ghost" style="flex:1" onclick="hiitReset()">重置</button></div>
      <div class="small" style="margin-top:8px;text-align:center">训练/休息切换会响铃 + 震动；屏幕熄灭时可能暂停，请保持屏幕常亮。</div>`;
  }
  return `<div class="sheet-head"><h3>休息计时</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <div class="timer-big" id="restTime">01:00</div>
    <div class="chips" style="justify-content:center;margin-top:12px">${[30,60,90,120,180].map(s=>`<button class="chip" onclick="restStart(${s})">${s}s</button>`).join('')}</div>
    <div style="height:10px"></div>
    <div class="row"><button class="btn ghost" style="flex:1" onclick="restToggle()">暂停/继续</button><button class="btn ghost" style="flex:1" onclick="restReset()">重置</button></div>`;
}
function presetHIIT(w,r,n){hiit.work=w;hiit.rest=r;hiit.rounds=n;renderSheet();}
let audioCtx=null;
function beep(freq,dur){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;g.gain.value=0.18;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(dur||0.15));
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
}
function fmtClock(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateTimerUI(){
  const t=document.getElementById('hiitTime');
  if(t){
    document.getElementById('hiitTime').textContent=fmtClock(hiit.left);
    const names={prep:'准备',work:'训练',rest:'休息',done:'完成',idle:'准备'};
    document.getElementById('hiitPhase').textContent=names[hiit.phase]||'准备';
    document.getElementById('hiitRound').textContent='第 '+hiit.round+' / '+hiit.rounds+' 轮';
  }
  const rt=document.getElementById('restTime');
  if(rt)document.getElementById('restTime').textContent=fmtClock(restTimer.left);
}
function hiitStart(){
  if(hiit.running)return;
  hiit.work=Number(document.getElementById('hWork').value)||20;
  hiit.rest=Number(document.getElementById('hRest').value)||10;
  hiit.rounds=Number(document.getElementById('hRounds').value)||8;
  hiit.prep=Number(document.getElementById('hPrep').value)||10;
  hiit.phase='prep';hiit.left=hiit.prep;hiit.round=0;hiit.running=true;
  if(hiit.timer)clearInterval(hiit.timer);
  hiit.timer=setInterval(hiitTick,1000);
  updateTimerUI();
}
function hiitTick(){
  if(!hiit.running)return;
  hiit.left--;
  if(hiit.left<=0){
    if(hiit.phase==='prep'){hiit.phase='work';hiit.left=hiit.work;hiit.round=1;beep(880);}
    else if(hiit.phase==='work'){
      if(hiit.round>=hiit.rounds){hiit.phase='done';hiit.running=false;clearInterval(hiit.timer);hiit.timer=null;beep(1320,.4);}
      else{hiit.phase='rest';hiit.left=hiit.rest;beep(440);}
    }else if(hiit.phase==='rest'){hiit.round++;hiit.phase='work';hiit.left=hiit.work;beep(880);}
  }
  updateTimerUI();
}
function hiitPause(){if(hiit.phase==='done'||hiit.phase==='idle')return;hiit.running=!hiit.running;if(hiit.running){if(!hiit.timer)hiit.timer=setInterval(hiitTick,1000);}else{clearInterval(hiit.timer);hiit.timer=null;}}
function hiitReset(){if(hiit.timer)clearInterval(hiit.timer);hiit.timer=null;hiit.running=false;hiit.phase='idle';hiit.left=0;hiit.round=0;updateTimerUI();}
function restStart(sec){restTimer.total=sec;restTimer.left=sec;restTimer.running=true;if(restTimer.timer)clearInterval(restTimer.timer);restTimer.timer=setInterval(restTick,1000);updateTimerUI();}
function restTick(){
  if(!restTimer.running)return;
  restTimer.left--;
  if(restTimer.left<=0){restTimer.left=0;restTimer.running=false;clearInterval(restTimer.timer);restTimer.timer=null;beep(1320,.4);}
  updateTimerUI();
}
function restToggle(){if(restTimer.left<=0)return;restTimer.running=!restTimer.running;if(restTimer.running){if(!restTimer.timer)restTimer.timer=setInterval(restTick,1000);}else{clearInterval(restTimer.timer);restTimer.timer=null;}}
function restReset(){if(restTimer.timer)clearInterval(restTimer.timer);restTimer.timer=null;restTimer.running=false;restTimer.left=restTimer.total;updateTimerUI();}

/* ===================== 导入导出 ===================== */
function download(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportJSON(){download('减脂工作台备份_'+todayStr()+'.json',JSON.stringify(S,null,2),'application/json');toast('已导出 JSON');}
function csvCell(v){if(v==null)return '';const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(kind){
  let head,rows=[];
  if(kind==='daily'){
    head=['日期','体重kg','7日均重','腰围cm','臀围cm','大腿cm','上臂cm','胸围cm','颈围cm','睡眠h','步数','饥饿感','压力','精力','饮水ml','训练','热量kcal','蛋白g','脂肪g','碳水g','备注'];
    rows=Object.keys(S.days).sort().map(d=>{const day=S.days[d],t=dayTotals(day),a=avgWeight(d,7);return [d,day.weight,a!=null?a.toFixed(2):'',day.waist,day.hip,day.thigh,day.arm,day.chest,day.neck,day.sleep,day.steps,day.hunger,day.stress,day.energy,day.water,day.training,Math.round(t.k),round1(t.p),round1(t.f),round1(t.c),day.note||''];});
  }else if(kind==='meals'){
    head=['日期','餐次','食物','克数','热量kcal','蛋白g','脂肪g','碳水g'];
    Object.keys(S.days).sort().forEach(d=>{MEALS.forEach(m=>{(S.days[d].meals[m.id]||[]).forEach(it=>{const x=itemMacros(it);rows.push([d,m.name,it.n,it.g,Math.round(x.k),round1(x.p),round1(x.f),round1(x.c)]);});});});
  }else if(kind==='workouts'){
    head=['日期','类型','项目','组数','次数','重量kg','RPE','时长min','坡度','速度','肌群'];
    Object.keys(S.days).sort().forEach(d=>{(S.days[d].workouts||[]).forEach(w=>{rows.push([d,w.kind==='cardio'?'有氧':'力量',w.name,w.sets||'',w.reps||'',w.weight||'',w.rpe||'',w.duration||'',w.incline||'',w.speed||'',w.muscle||'']);});});
  }else{
    head=['日期','腰围','臀围','大腿','上臂','胸围','颈围','体脂Navy','BMI'];
    rows=Object.keys(S.days).sort().map(d=>{
      const day=S.days[d];
      const w=day.weight||S.profile.weight;
      const b=w&&S.profile.height?w/Math.pow(S.profile.height/100,2):null;
      return [d,day.waist,day.hip,day.thigh,day.arm,day.chest,day.neck,bodyFatNavy(d)!=null?round1(bodyFatNavy(d)):'',b!=null?round1(b):''];
    });
  }
  const csv='\ufeff'+[head.map(csvCell).join(','),...rows.map(r=>r.map(csvCell).join(','))].join('\n');
  download(`减脂_${kind}_${todayStr()}.csv`,csv,'text/csv;charset=utf-8');toast('已导出 CSV');
}
function importJSON(input){
  const file=input.files&&input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const m=migrate(obj);
      if(!m)throw new Error('bad');
      if(!confirm('导入会覆盖当前全部数据，确定吗？'))return;
      S=m;normalizeState();save();render();toast('导入成功');
    }catch(e){toast('导入失败：文件格式不对');}
    input.value='';
  };
  r.readAsText(file);
}
function clearAll(){
  if(!confirm('确定清空全部数据？建议先导出 JSON 备份。'))return;
  if(!confirm('再确认一次：清空后无法恢复。'))return;
  S=defaultState();save();render();toast('已清空');
}

function finishOnboarding(){

  save();closeSheet();render();toast('已生成你的目标');
}
